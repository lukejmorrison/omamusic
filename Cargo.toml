[package]
name = "omamusic"
version = "1.3.0"
edition = "2021"
rust-version = "1.80"
authors = ["Wizwam / Luke Morrison"]
license = "MIT"
description = "Oma Music — YouTube Music playback daemon for Omarchy (mpv + yt-dlp)"
repository = "https://github.com/lukejmorrison/omamusic"
readme = "README.md"
keywords = ["youtube-music", "omarchy", "mpv", "player"]
categories = ["multimedia::audio", "command-line-utilities"]

[lib]
name = "omamusic"
path = "src/lib.rs"

[[bin]]
name = "omamusic"
path = "src/main.rs"

[dependencies]
aes = "0.8"
anyhow = "1"
cbc = "0.1"
cipher = { version = "0.4", features = ["alloc", "block-padding"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
pbkdf2 = "0.12"
rand = "0.8"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "gzip", "rustls-tls", "cookies"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
